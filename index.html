
<!DOCTYPE html>
<html>
<head>
  <title>System Breach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      text-align: center;
      margin: 0;
      overflow: hidden;
    }

    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
    }

    .hidden { display: none; }

    @keyframes glitch {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .glitch {
      animation: glitch 0.08s infinite;
    }

    #progress {
      font-size: 22px;
      margin-top: 15px;
      color: red;
    }

    h1 { font-size: 26px; }
    p { font-size: 16px; }
  </style>
</head>
<body>

<div class="container glitch">
  <h1 id="title">⚠️ SYSTEM BREACH ⚠️</h1>
  <p id="line">Initializing...</p>
  <p id="progress">0%</p>

  <h1 id="fool" class="hidden">😂 APRIL FOOL 'hush'😂</h1>
</div>

<script>
  let messages = [
    "Connecting to device...",
    "Bypassing security...",
    "Accessing WhatsApp...",
    "Uploading contacts...",
    "Camera access granted...",
    "Tracking location...",
    "Decrypting data...",
    "Sending files...",
    "Injecting payload...",
    "Finalizing..."
  ];

  let i = 0;
  let progress = 0;

  let interval = setInterval(() => {
    document.getElementById("line").innerText = messages[i % messages.length];
    i++;

    progress += Math.floor(Math.random() * 18);
    if (progress > 100) progress = 100;

    document.getElementById("progress").innerText = progress + "%";

    if (progress >= 100) {
      clearInterval(interval);

      setTimeout(() => {
        document.getElementById("title").classList.add("hidden");
        document.getElementById("line").classList.add("hidden");
        document.getElementById("progress").classList.add("hidden");

        document.getElementById("fool").classList.remove("hidden");
        document.body.style.color = "white";
      }, 500);
    }

  }, 80); // ⚡ very fast

  // vibration on tap
  document.body.addEventListener("click", () => {
    if (navigator.vibrate) {
      navigator.vibrate([200,100,200,100,400]);
    }
  });
</script>

</body>
</html>
